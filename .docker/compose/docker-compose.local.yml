# Hosts the app answers on (via the shared Traefik on :80):
#   - http://${APP_SLUG}.${SERVER_DOMAIN}            (this machine)
#   - http://<lan-ip>                                 (phones on the local network)
#   - http://${APP_SLUG}.<lan-ip>.nip.io             (phones, if they prefer a name)
#   - https://<random>.trycloudflare.com              (anyone online, while `make public` runs)

x-app: &app
  image: ${APP_SLUG}:${APP_ENV}
  build:
    context: ${PROJECT_DIRECTORY}
    dockerfile: ${PROJECT_DIRECTORY}/.docker/Dockerfile
    target: ${APP_ENV}
    args:
      - PHP_VERSION=${PHP_VERSION:-85}
      - UID=${HOST_UID:-1000}
      - GID=${HOST_GID:-1000}
  environment:
    - APP_SLUG=${APP_SLUG}
    - SERVER_DOMAIN=${SERVER_DOMAIN:-localhost}
    - LAN_IP=${LAN_IP:-}
  env_file:
    - ${ENV_FILE}
  networks:
    - app_network
  volumes:
    - ${PROJECT_DIRECTORY}/:/var/www/app:rw
    - ${PROJECT_DIRECTORY}/.docker/src/etc/supervisord.conf:/etc/supervisord.conf:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/php/conf.d/000-php-settings.ini:/etc/php${PHP_VERSION:-85}/conf.d/000-php-settings.ini:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/php/php-fpm.d/www.conf:/etc/php${PHP_VERSION:-85}/php-fpm.d/www.conf:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/php/php-fpm.conf:/etc/php${PHP_VERSION:-85}/php-fpm.conf:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ${PROJECT_DIRECTORY}/.docker/src/etc/nginx/conf.d/app.conf:/etc/nginx/conf.d/app.conf:ro
  depends_on:
    - db
    - cache

services:

  cli:
    <<: *app
    container_name: ${APP_SLUG}_${APP_ENV}_cli
    user: www-data
    command: [ 'tail', '-f', '/dev/null' ]
    ports:
      # Vite dev server (make vite); reachable from phones on the LAN as well
      - "5173:5173"
    labels:
      - docker-compose.pwd=${PWD}

  frontend:
    <<: *app
    container_name: ${APP_SLUG}_${APP_ENV}_frontend
    command: [ '/bin/sh', '-c', '/usr/bin/supervisord -n -c /etc/supervisord.conf' ]
    networks:
      - app_network
      - traefik_network
    labels:
      - docker-compose.pwd=${PWD}
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-frontend.service=${APP_SLUG}-${APP_ENV}-frontend
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-frontend.rule=(Host(`${APP_SLUG}.${SERVER_DOMAIN:-localhost}`) || HostRegexp(`^${APP_SLUG}\..+\.nip\.io$$`) || HostRegexp(`^(\d{1,3}\.){3}\d{1,3}$$`) || HostRegexp(`^[a-z0-9-]+\.trycloudflare\.com$$`))
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-frontend.entrypoints=http
      - traefik.http.services.${APP_SLUG}-${APP_ENV}-frontend.loadbalancer.server.port=80

  reverb:
    <<: *app
    container_name: ${APP_SLUG}_${APP_ENV}_reverb
    user: www-data
    command: [ '/bin/sh', '-c', 'php artisan reverb:start --host=0.0.0.0 --port=8080 --debug' ]
    networks:
      - app_network
      - traefik_network
    labels:
      - docker-compose.pwd=${PWD}
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      # Same hosts as the frontend; Reverb owns the Pusher-protocol paths /app/* (WebSocket) and /apps/* (HTTP API)
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-reverb.service=${APP_SLUG}-${APP_ENV}-reverb
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-reverb.rule=(Host(`${APP_SLUG}.${SERVER_DOMAIN:-localhost}`) || HostRegexp(`^${APP_SLUG}\..+\.nip\.io$$`) || HostRegexp(`^(\d{1,3}\.){3}\d{1,3}$$`) || HostRegexp(`^[a-z0-9-]+\.trycloudflare\.com$$`)) && (PathPrefix(`/app/`) || PathPrefix(`/apps/`))
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-reverb.priority=1000
      - traefik.http.routers.${APP_SLUG}-${APP_ENV}-reverb.entrypoints=http
      - traefik.http.services.${APP_SLUG}-${APP_ENV}-reverb.loadbalancer.server.port=8080

  worker:
    <<: *app
    container_name: ${APP_SLUG}_${APP_ENV}_worker
    user: www-data
    command: [ '/bin/sh', '-c', 'php artisan queue:work --tries=3' ]
    labels:
      - docker-compose.pwd=${PWD}

  scheduler:
    <<: *app
    container_name: ${APP_SLUG}_${APP_ENV}_scheduler
    user: www-data
    command: [ '/bin/sh', '-c', 'php artisan schedule:work' ]
    labels:
      - docker-compose.pwd=${PWD}

  db:
    container_name: ${APP_SLUG}_${APP_ENV}_database
    image: postgres:18-alpine
    environment:
      - PGTZ=${TZ:-Europe/Budapest}
      - POSTGRES_DB=${APP_SLUG}-${APP_ENV}-database
      - POSTGRES_USER=${APP_SLUG}-${APP_ENV}-user
      - POSTGRES_PASSWORD=${APP_SLUG}-${APP_ENV}-password
    networks:
      - app_network
    ports:
      # Non-default host port so it doesn't clash with other projects' Postgres on 5432
      - "5442:5432"
    volumes:
      - database_volume:/var/lib/postgresql
    labels:
      - docker-compose.pwd=${PWD}

  cache:
    container_name: ${APP_SLUG}_${APP_ENV}_cache
    image: redis:8-alpine
    networks:
      - app_network
    volumes:
      - cache_volume:/data
    labels:
      - docker-compose.pwd=${PWD}

networks:

  app_network:
    name: ${APP_SLUG}_${APP_ENV}_network
    labels:
      - docker-compose.pwd=${PWD}

  traefik_network:
    name: ${TRAEFIK_NETWORK:-traefik_network}
    external: true

volumes:

  database_volume:
    name: ${APP_SLUG}_${APP_ENV}_database_volume
    labels:
      - docker-compose.pwd=${PWD}

  cache_volume:
    name: ${APP_SLUG}_${APP_ENV}_cache_volume
    labels:
      - docker-compose.pwd=${PWD}
